<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Music Terms Flashcards</title>
<style>
  :root{
    --bg:#14121a; --cream:#f7f1e1; --cream-dim:#e9e0c9;
    --gold:#c9a227; --gold-soft:#e3c565; --ink:#2a2433; --muted:#8d86a0;
    --chip:#262133;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100dvh; color:var(--cream);
    font-family:Georgia,'Garamond','Times New Roman',serif;
    background:radial-gradient(1200px 800px at 50% -10%, #241f33 0%, var(--bg) 55%) fixed;
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  .identity{width:100%; max-width:560px; padding:18px 4px 4px;}
  .identity label{display:block; font-size:.85rem; color:var(--muted); font-style:italic; margin-bottom:8px; text-align:center;}
  .identity input{
    width:100%; font-family:inherit; font-size:1.15rem; padding:14px 16px; border-radius:14px;
    border:1px solid #3a3450; background:#1d1926; color:var(--cream); text-align:center;
  }
  .identity input:focus{outline:none; border-color:var(--gold);}
  .identity input.need{border-color:#b05252; animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .moderow{display:flex; gap:10px; margin-top:12px;}
  .moderow .btn{flex:1; max-width:none;}
  .who{text-align:center; font-size:.85rem; color:var(--muted); font-style:italic; padding:10px 0 0; min-height:1.4em;}
  .who b{color:var(--gold-soft); font-style:normal;}
  header{text-align:center; padding:14px 8px 4px;}
  header h1{font-size:1.6rem; margin:0 0 4px; letter-spacing:.5px; font-weight:600;}
  header h1 .note{color:var(--gold-soft); font-size:1.8rem; vertical-align:-2px;}
  header p{margin:0; color:var(--muted); font-size:.85rem; font-style:italic;}
  section{width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center;}
  [hidden]{display:none!important;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px 4px 4px; max-width:640px;}
  .chip{
    border:1px solid #3a3450; background:var(--chip); color:var(--cream-dim);
    border-radius:999px; padding:7px 14px; font-size:.82rem; cursor:pointer;
    font-family:inherit; transition:all .15s;
  }
  .chip.active{background:var(--gold); border-color:var(--gold); color:#1a1620; font-weight:bold;}
  .toolbar{display:flex; gap:10px; align-items:center; justify-content:center; padding:10px 0 2px; flex-wrap:wrap;}
  .pill{
    border:1px solid #3a3450; background:transparent; color:var(--cream-dim);
    border-radius:999px; padding:6px 13px; font-size:.78rem; cursor:pointer; font-family:inherit;
  }
  .pill.active{border-color:var(--gold); color:var(--gold-soft);}
  .stage{width:100%; max-width:560px; padding:14px 0 4px; perspective:1200px;}
  .card{
    position:relative; width:100%; aspect-ratio:3/4.1; max-height:62dvh; min-height:380px;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.3,.7,.3,1);
    cursor:pointer; user-select:none;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:34px 28px; text-align:center;
    background:linear-gradient(160deg,#fbf6e8 0%, var(--cream) 60%, #efe4c8 100%);
    color:var(--ink); box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 0 0 1px rgba(160,130,60,.25);
  }
  .face.back{transform:rotateY(180deg); background:linear-gradient(160deg,#f4ecda 0%, #ece0c2 100%);}
  .cat-tag{position:absolute; top:16px; left:0; right:0; font-size:.72rem; letter-spacing:2.5px; text-transform:uppercase; color:#9a7b2d;}
  .term{font-size:clamp(2rem, 9vw, 3rem); margin:6px 0 2px; line-height:1.1;}
  .abbr{font-size:1.05rem; color:#7a6a45; font-style:italic; margin-top:2px;}
  .def{font-size:clamp(1.05rem, 4.6vw, 1.3rem); line-height:1.55; max-width:42ch;}
  .def-term{font-size:1rem; color:#7a6a45; font-style:italic; margin-top:14px;}
  .hint{margin-top:22px; font-size:.78rem; color:#a08c5a; font-style:italic;}
  .backSvg svg{width:150px; max-width:70%; height:auto; display:block; margin:2px auto 10px;}
  .known-star{position:absolute; top:12px; right:14px; font-size:1.5rem; cursor:pointer; z-index:2; color:#c9bfa4; background:none; border:none; padding:6px; line-height:1;}
  .known-star.lit{color:var(--gold);}
  .progress{width:100%; max-width:560px; padding:10px 2px 0;}
  .bar{height:5px; background:#2c2739; border-radius:99px; overflow:hidden;}
  .bar > div{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-soft)); border-radius:99px; transition:width .3s;}
  .count{display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); padding:7px 2px 0;}
  .controls{display:flex; gap:10px; justify-content:center; align-items:center; padding:14px 0 8px; width:100%; max-width:560px;}
  .btn{
    font-family:inherit; border:1px solid #3a3450; background:var(--chip); color:var(--cream);
    border-radius:14px; padding:13px 18px; font-size:1rem; cursor:pointer; min-width:64px;
    transition:transform .1s;
  }
  .btn:active{transform:scale(.96);}
  .btn.primary{background:var(--gold); border-color:var(--gold); color:#1a1620; font-weight:bold; flex:1; max-width:200px;}
  .btn.ghost{background:transparent;}
  .empty{text-align:center; padding:60px 20px; color:var(--muted); font-style:italic; font-size:1.05rem; line-height:1.7;}
  .empty button{margin-top:14px;}
  .panel{width:100%; background:#1d1926; border:1px solid #332d47; border-radius:18px; padding:22px 20px; margin-top:12px;}
  .panel h2{margin:0 0 14px; font-size:1.25rem; font-weight:600; display:flex; align-items:center; justify-content:space-between;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.85rem; color:var(--muted); margin-bottom:6px; font-style:italic;}
  .field select, .field input{
    width:100%; font-family:inherit; font-size:1rem; padding:12px 14px; border-radius:12px;
    border:1px solid #3a3450; background:#14121a; color:var(--cream);
  }
  .qprog{margin-bottom:16px;}
  .qdef{
    background:linear-gradient(160deg,#fbf6e8,#efe4c8); color:var(--ink);
    border-radius:14px; padding:26px 22px; font-size:1.2rem; line-height:1.6; text-align:center; margin-bottom:14px;
  }
  .qopts{display:flex; flex-direction:column; gap:10px;}
  .opt{
    font-family:inherit; text-align:left; font-size:1.05rem; padding:14px 16px; border-radius:12px;
    border:1px solid #3a3450; background:#14121a; color:var(--cream); cursor:pointer;
  }
  .opt.correct{border-color:#4caf6d; background:#1c2f24; color:#bfe8c9;}
  .opt.wrong{border-color:#b05252; background:#2f1c1c; color:#eec3c3;}
  .opt:disabled{cursor:default; opacity:.95;}
  #qNext{width:100%; margin-top:14px;}
  #qScore{font-size:2.2rem; text-align:center; margin:6px 0;}
  #qDetail{text-align:center; color:var(--muted); font-style:italic; line-height:1.7;}
  #qAgain{width:100%; margin-top:16px;}
  #quizStart{width:100%; margin-top:6px;}
  .srow{display:flex; align-items:flex-start; gap:10px; padding:14px 4px; border-bottom:1px solid #2b2639;}
  .srow:last-child{border-bottom:none;}
  .sname{flex:1; font-size:1.05rem; line-height:1.5;}
  .sstats{font-size:.8rem; color:var(--muted); font-style:italic; line-height:1.6; margin-top:4px;}
  .squiz{font-size:.78rem; color:#a89cc0; margin-top:6px; line-height:1.7;}
  .sbtn{
    font-family:inherit; font-size:.78rem; border:1px solid #3a3450; background:transparent;
    color:var(--cream-dim); border-radius:99px; padding:7px 13px; cursor:pointer; white-space:nowrap;
  }
  .sbtn.danger{border-color:#6e3a3a; color:#d99a9a;}
  .sempty{color:var(--muted); font-style:italic; padding:16px 0 4px; text-align:center; line-height:1.6;}
  .lockbtn{background:none; border:none; color:var(--muted); font-family:inherit; font-size:.85rem; cursor:pointer; font-style:italic;}
  footer{color:#5d5770; font-size:.72rem; padding:18px 0 26px; text-align:center; font-style:italic;}
  .linkbtn{background:none; border:none; color:#5d5770; font-family:inherit; font-size:.72rem; font-style:italic; cursor:pointer; text-decoration:underline; padding:0;}
</style>
</head>
<body>

<!-- NAME INPUT — very top -->
<div class="identity">
  <label for="nameInput">Enter your name to begin</label>
  <input id="nameInput" placeholder="Your name" maxlength="40" autocomplete="off">
  <div class="moderow">
    <button class="btn primary" id="studyBtn">Study cards</button>
    <button class="btn primary" id="quizBtn">Take quiz</button>
  </div>
  <div class="who" id="whoLine"></div>
</div>

<header>
  <h1><span class="note">♪</span> Music Terms Flashcards</h1>
  <p>For undergraduate music &amp; piano majors</p>
</header>

<!-- STUDY -->
<section id="view-study">
  <div class="chips" id="chips"></div>
  <div class="toolbar">
    <button class="pill" id="starredToggle" title="Review only the cards you starred">★ Starred only</button>
  </div>
  <div class="stage">
    <div class="card" id="card" role="button" aria-label="Flashcard. Tap to flip.">
      <button class="known-star" id="star" title="Mark as known">★</button>
      <div class="face front">
        <div class="cat-tag" id="frontCat"></div>
        <div class="term" id="frontMain"></div>
        <div class="abbr" id="frontSub"></div>
        <div class="hint">tap to flip</div>
      </div>
      <div class="face back">
        <div class="cat-tag" id="backCat"></div>
        <div class="backSvg" id="backSvg"></div>
        <div class="def" id="backMain"></div>
        <div class="def-term" id="backSub"></div>
        <div class="hint">tap to flip back</div>
      </div>
    </div>
    <div class="empty" id="empty" style="display:none">
      <span id="emptyMsg"></span><br>
      <button class="btn ghost" id="resetKnown">Reset progress</button>
    </div>
  </div>
  <div class="progress">
    <div class="bar"><div id="barFill"></div></div>
    <div class="count"><span id="countLabel"></span><span id="knownLabel"></span></div>
  </div>
  <div class="controls">
    <button class="btn" id="prev" aria-label="Previous card">←</button>
    <button class="btn primary" id="flipBtn">Flip</button>
    <button class="btn" id="next" aria-label="Next card">→</button>
    <button class="btn ghost" id="shuffle" aria-label="Shuffle deck" title="Shuffle">Shuffle</button>
  </div>
</section>

<!-- QUIZ -->
<section id="view-quiz" hidden>
  <div class="panel" id="quizSetup">
    <h2>Quiz <span class="who" id="quizWho" style="font-size:.8rem; padding:0; min-height:0;"></span></h2>
    <div class="field"><label>Category</label><select id="quizCat"></select></div>
    <div class="field"><label>Questions</label>
      <select id="quizCount"><option value="5">5</option><option value="10">10</option><option value="20" selected>20</option><option value="all">All cards</option></select>
    </div>
    <button class="btn primary" id="quizStart">Start quiz</button>
  </div>
  <div class="panel" id="quizPlay" hidden>
    <div class="qprog">
      <div class="bar"><div id="qBar"></div></div>
      <div class="count"><span id="qCount"></span><span id="qScoreLive"></span></div>
    </div>
    <div class="qdef" id="qDef"></div>
    <div class="qopts" id="qOpts"></div>
    <button class="btn primary" id="qNext" hidden>Next →</button>
    <button class="btn ghost" id="qEnd" style="width:100%; margin-top:10px;">End quiz early</button>
  </div>
  <div class="panel" id="quizDone" hidden>
    <h2 id="qScore"></h2>
    <p id="qDetail"></p>
    <button class="btn primary" id="qAgain">New quiz</button>
  </div>
</section>

<!-- ADMIN LOGIN -->
<section id="view-adminlogin" hidden>
  <div class="panel">
    <h2>Admin</h2>
    <div class="field"><label>Passcode</label><input id="passInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>
    <button class="btn primary" id="unlockBtn" style="width:100%">Unlock</button>
    <div class="sempty" id="passMsg" style="display:none">Incorrect passcode.</div>
  </div>
</section>

<!-- ADMIN -->
<section id="view-admin" hidden>
  <div class="panel">
    <h2>Students <button class="lockbtn" id="lockBtn">lock 🔒</button></h2>
    <div id="adminList"></div>
    <h2 style="margin-top:10px;">All devices (synced)</h2>
    <div id="adminRemote"><span class="sempty">Loading…</span></div>
  </div>
</section>

<footer>
  Tap a card or press space to flip · ← → to move · swipe on touch screens<br><br>
  <button class="linkbtn" id="adminLink">Admin</button>
</footer>

<script>
const CARDS = [
  {t:"allargando", a:"allarg.", d:"Growing broader; gradually slowing down and becoming more stately and emphatic.", c:"Tempo"},
  {t:"rallentando", a:"rall.", d:"Gradually slowing down the tempo.", c:"Tempo"},
  {t:"ritenuto", a:"riten.", d:"Held back; an immediate slight slowing of tempo, rather than a gradual one.", c:"Tempo"},
  {t:"meno mosso", a:"meno.", d:"Less motion; play at a slower tempo.", c:"Tempo"},
  {t:"rubato", a:"tempo rubato", d:"“Robbed time.” Per the Harvard Dictionary of Music: expressive flexibility of tempo — the melody may linger or hurry while the accompaniment keeps steady time, or the whole texture may speed and slow within a phrase.", c:"Tempo"},
  {t:"stringendo", a:"string.", d:"Pressing forward; hurrying or accelerating the tempo.", c:"Tempo"},
  {t:"accelerando", a:"accel.", d:"Gradually getting faster.", c:"Tempo"},
  {t:"calando", a:"cal.", d:"Getting softer and slower; dying down in both volume and speed.", c:"Tempo"},
  {t:"smorzando", a:"smorz.", d:"Dying away; fading gradually in both sound and tempo.", c:"Dynamics"},
  {t:"morendo", a:"mor.", d:"Dying; fading away to nothing.", c:"Dynamics"},
  {t:"perdendosi", a:"perd.", d:"Dying away; literally “losing itself” — fading into silence.", c:"Dynamics"},
  {t:"sforzando", a:"sfz · sf", d:"A sudden, strong accent on a single note or chord.", c:"Dynamics"},
  {t:"sempre", a:"—", d:"Always; e.g. sempre staccato or sempre pp — continue in the same manner throughout.", c:"Dynamics"},
  {t:"rinforzando", a:"rfz · rinf.", d:"Reinforced; played with special emphasis or stress.", c:"Dynamics"},
  {t:"sotto voce", a:"—", d:"“Under the voice.” In a subdued undertone; very softly and restrained.", c:"Dynamics"},
  {t:"con forza", a:"—", d:"With force; forcefully and powerfully.", c:"Dynamics"},
  {t:"appassionato", a:"—", d:"Impassioned; with intense feeling and passion.", c:"Expression"},
  {t:"con fuoco", a:"—", d:"With fire; fiery, blazing, and energetic.", c:"Expression"},
  {t:"leggiero", a:"—", d:"Lightly and nimbly; with delicacy and ease.", c:"Expression"},
  {t:"con brio", a:"—", d:"With vigor and spirit; lively and spirited.", c:"Expression"},
  {t:"con moto", a:"—", d:"With motion; with lively, forward movement.", c:"Expression"},
  {t:"agitato", a:"—", d:"Agitated; restless and hurried in character.", c:"Expression"},
  {t:"maestoso", a:"—", d:"Majestic; stately and dignified.", c:"Expression"},
  {t:"scherzando", a:"—", d:"Playful and joking; lighthearted in character.", c:"Expression"},
  {t:"tenuto", a:"ten.", d:"Held for its full value; the note is sustained slightly and gently stressed.", c:"Ornaments & Articulation"},
  {t:"marcato", a:"marc.", d:"Marked; each note played with clear emphasis.", c:"Ornaments & Articulation"},
  {t:"glissando", a:"gliss.", d:"Sliding rapidly across consecutive notes, up or down.", c:"Ornaments & Articulation"},
  {t:"appoggiatura", a:"—", d:"A leaning grace note that borrows half (or two-thirds) of the main note’s value, played on the beat.", c:"Ornaments & Articulation"},
  {t:"acciaccatura", a:"—", d:"A crushed grace note, played very quickly just before the beat.", c:"Ornaments & Articulation"},
  {t:"mordent", a:"—", d:"Rapid alternation between the written note and the note directly above or below it.", c:"Ornaments & Articulation"},
  {t:"turn", a:"gruppetto · ∼", d:"An ornament circling the main note: upper neighbor, main note, lower neighbor, main note.", c:"Ornaments & Articulation"},
];

/* ---------- notation diagrams for ornament cards ---------- */
const dia=inner=>`<svg viewBox="0 0 200 100" fill="none"><g stroke="#2a2433" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;
const NH=(cx,cy,rx=11,ry=8)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#2a2433" stroke="none" transform="rotate(-18 ${cx} ${cy})"/>`;
const ORN={
  tenuto: dia(`<rect x="70" y="46" width="60" height="8" rx="2" fill="#2a2433" stroke="none"/>`),
  marcato: dia(`<path d="M100,22 L78,66 L122,66 Z" fill="#2a2433" stroke="none"/>`),
  glissando: dia(`<path d="M36,78 q16,-4 30,-14 t30,-14 t30,-14 t30,-14"/>`),
  appoggiatura: dia(NH(58,62,7,5.5)+`<line x1="64" y1="60" x2="64" y2="28" stroke-width="3"/><path d="M72,50 Q104,32 134,52" stroke-width="2.5"/>`+NH(142,60)+`<line x1="151.5" y1="57" x2="151.5" y2="18"/>`),
  acciaccatura: dia(NH(58,62,7,5.5)+`<line x1="64" y1="60" x2="64" y2="28" stroke-width="3"/><line x1="74" y1="30" x2="56" y2="62" stroke-width="3"/><path d="M72,50 Q104,32 134,52" stroke-width="2.5"/>`+NH(142,60)+`<line x1="151.5" y1="57" x2="151.5" y2="18"/>`),
  mordent: dia(`<path d="M60,52 l9,-10 l9,10 l9,-10 l9,10 l9,-10 l9,10"/><line x1="87" y1="34" x2="87" y2="70"/>`),
  turn: dia(`<path d="M36,50 C56,32 78,32 100,50 C122,68 144,68 164,50"/>`),
};
CARDS.forEach(c=>{ if(ORN[c.t]) c.s=ORN[c.t]; });
const CATS = ["All","Tempo","Dynamics","Expression","Ornaments & Articulation"];
const $ = id => document.getElementById(id);
const ADMIN_PASS = "0229";

/* ---------- shared results (Firebase Realtime Database) ---------- */
const FIREBASE_DB_URL="https://music-flashcards-d2bf8-default-rtdb.firebaseio.com"; /* paste your database URL here, e.g. https://music-flashcards-abc12-default-rtdb.firebaseio.com */
const fbURL=()=>FIREBASE_DB_URL?FIREBASE_DB_URL.replace(/\/+$/,"")+"/results.json":"";
function queueSync(item){ try{ const q=JSON.parse(localStorage.getItem("mtf-queue")||"[]"); q.push(item); localStorage.setItem("mtf-queue",JSON.stringify(q)); }catch(e){} }
async function flushQueue(){
  if(!fbURL()) return;
  let q=[]; try{ q=JSON.parse(localStorage.getItem("mtf-queue")||"[]"); }catch(e){}
  if(!q.length) return;
  const rest=[];
  for(const item of q){
    try{ const r=await fetch(fbURL(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(item)});
      if(!r.ok) rest.push(item);
    }catch(e){ rest.push(item); }
  }
  try{ localStorage.setItem("mtf-queue",JSON.stringify(rest)); }catch(e){}
}
function syncResult(item){
  if(!fbURL()) return;
  fetch(fbURL(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(item)})
    .then(r=>{ if(!r.ok) queueSync(item); })
    .catch(()=>queueSync(item));
}

/* ---------- store ---------- */
let store = {students:[], active:null, admin:false};
try{ const s=JSON.parse(localStorage.getItem("mtf-v4")); if(s&&s.students) store=s; }catch(e){}
function save(){ try{ localStorage.setItem("mtf-v4",JSON.stringify(store)); }catch(e){} }
const uid = () => "s"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
const activeStudent = () => store.students.find(s=>s.id===store.active)||null;
const knownSet = () => new Set((activeStudent()||{known:[]}).known);
function setKnown(set){ const st=activeStudent(); if(!st) return; st.known=[...set]; save(); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

/* ---------- views ---------- */
const VIEWS = ["view-study","view-quiz","view-adminlogin","view-admin"];
function showView(id){
  VIEWS.forEach(v=>{ $(v).hidden = v!==id; });
  window.scrollTo({top:0,behavior:"smooth"});
  if(id==="view-admin") renderAdmin();
  if(id==="view-quiz") renderQuizSetup();
}

/* ---------- identity ---------- */
function ensureStudent(name){
  const clean=name.trim();
  let s=store.students.find(x=>x.name.toLowerCase()===clean.toLowerCase());
  if(!s){ s={id:uid(), name:clean, known:[], quizzes:[]}; store.students.push(s); }
  store.active=s.id; save(); updateWho(); return s;
}
function updateWho(){
  const st=activeStudent();
  $("whoLine").innerHTML = st?`Studying as <b>${escapeHtml(st.name)}</b>`:"";
  const q=$("quizWho"); if(q) q.textContent = st?("for "+st.name):"";
}
function needName(){
  const inp=$("nameInput");
  inp.classList.remove("need"); void inp.offsetWidth; inp.classList.add("need");
  inp.focus();
}
$("studyBtn").onclick=()=>{ const v=$("nameInput").value.trim();
  if(!v){ needName(); return; } ensureStudent(v); resetDeck(); showView("view-study");
};
$("quizBtn").onclick=()=>{ const v=$("nameInput").value.trim();
  if(!v){ needName(); return; } const s=ensureStudent(v);
  showView("view-quiz");
  if(launchQuiz(s.id,"All",20)) showQuizPlay();
};
$("nameInput").addEventListener("keydown",e=>{ if(e.key==="Enter") $("studyBtn").click(); });
// returning student: prefill last active name
(function(){ const st=activeStudent(); if(st) $("nameInput").value=st.name; updateWho(); })();

/* ---------- cards ---------- */
let filter="All", dir="t2d", starredOnly=false, order=[], pos=0, flipped=false;
const card=$("card"), chipsEl=$("chips");
function deck(){
  let d=CARDS.map((c,i)=>i).filter(i=>filter==="All"||CARDS[i].c===filter);
  const k=knownSet();
  if(starredOnly) d=d.filter(i=>k.has(i));
  return d;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function resetDeck(){ order=shuffle(deck()); pos=0; flipped=false; render(); }
function renderChips(){
  chipsEl.innerHTML="";
  CATS.forEach(c=>{
    const b=document.createElement("button");
    b.className="chip"+(c===filter?" active":"");
    b.textContent=c==="All"?"All · "+CARDS.length:c;
    b.onclick=()=>{filter=c; resetDeck();};
    chipsEl.appendChild(b);
  });
}
function clearFaceStyle(){ ["frontMain","backMain"].forEach(id=>{ $(id).style.fontSize=""; $(id).style.lineHeight=""; }); }
function render(){
  const empty=order.length===0;
  $("empty").style.display=empty?"block":"none";
  if(empty){
    $("emptyMsg").textContent = starredOnly
      ? "No starred cards yet. Tap the ★ on any card to star it for review."
      : "No cards in this set.";
  }
  card.style.display=empty?"none":"block";
  document.querySelector("#view-study .progress").style.display=empty?"none":"block";
  document.querySelector("#view-study .controls").style.display=empty?"none":"flex";
  if(empty) return;
  const c=CARDS[order[pos]], k=knownSet();
  card.classList.toggle("flipped",flipped);
  clearFaceStyle();
  if(dir==="t2d"){
    $("frontCat").textContent=c.c; $("frontMain").textContent=c.t;
    $("frontSub").textContent=c.a==="—"?"":"("+c.a+")";
    $("backCat").textContent=c.c; $("backMain").textContent=c.d;
    $("backSub").textContent=c.t+(c.a==="—"?"":" · "+c.a);
    $("backSvg").innerHTML=c.s||"";
  }else{
    $("frontCat").textContent=c.c; $("frontMain").textContent=c.d;
    $("frontMain").style.fontSize="clamp(1rem,4.4vw,1.25rem)"; $("frontMain").style.lineHeight="1.55";
    $("frontSub").textContent="";
    $("backCat").textContent=c.c; $("backMain").textContent=c.t;
    $("backSub").textContent=c.a==="—"?"":c.a;
  }
  $("star").classList.toggle("lit",k.has(order[pos]));
  $("countLabel").textContent=(pos+1)+" / "+order.length;
  $("barFill").style.width=((pos+1)/order.length*100)+"%";
  const kc=order.filter(i=>k.has(i)).length;
  $("knownLabel").textContent=kc?("★ "+kc+" known"):"";
}
function flip(){ flipped=!flipped; card.classList.toggle("flipped",flipped); }
function next(){ if(!order.length)return; pos=(pos+1)%order.length; flipped=false; render(); }
function prev(){ if(!order.length)return; pos=(pos-1+order.length)%order.length; flipped=false; render(); }
card.addEventListener("click",e=>{ if(e.target.id!=="star") flip(); });
$("flipBtn").onclick=flip; $("next").onclick=next; $("prev").onclick=prev;
$("shuffle").onclick=resetDeck;
$("star").onclick=e=>{ e.stopPropagation(); if(!order.length)return;
  const k=knownSet(), i=order[pos];
  k.has(i)?k.delete(i):k.add(i); setKnown(k);
  if(starredOnly&&!k.has(i)){ order=order.filter(x=>x!==i); if(pos>=order.length)pos=0; flipped=false; }
  render();
};
$("starredToggle").onclick=()=>{ starredOnly=!starredOnly;
  $("starredToggle").classList.toggle("active",starredOnly); resetDeck();
};
$("resetKnown").onclick=()=>{ setKnown(new Set());
  starredOnly=false; $("starredToggle").classList.remove("active"); resetDeck();
};
document.addEventListener("keydown",e=>{
  if($("view-study").hidden) return;
  if(e.key==="ArrowRight")next(); else if(e.key==="ArrowLeft")prev();
  else if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
});
let tx=0;
card.addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX;},{passive:true});
card.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60){ dx<0?next():prev(); }
},{passive:true});

/* ---------- quiz ---------- */
let quiz=null;
function renderQuizSetup(){
  const cs=$("quizCat"); cs.innerHTML="";
  CATS.forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=c==="All"?"All categories":c; cs.appendChild(o); });
  updateWho();
  $("quizSetup").hidden=false; $("quizPlay").hidden=true; $("quizDone").hidden=true;
}
function startQuiz(){
  const st=activeStudent(); if(!st){ showView("view-study"); return; }
  const cat=$("quizCat").value;
  let n=$("quizCount").value; n=n==="all"?CARDS.length:parseInt(n,10);
  if(launchQuiz(st.id,cat,n)) showQuizPlay();
}
function launchQuiz(sid,cat,n){
  let pool=CARDS.map((c,i)=>i).filter(i=>cat==="All"||CARDS[i].c===cat);
  if(pool.length<4){ alert("Not enough cards in this category for a quiz."); return false; }
  pool=shuffle(pool).slice(0,Math.min(n,pool.length));
  const qs=pool.map(ci=>{
    const sameCat=CARDS.map((c,i)=>i).filter(i=>i!==ci&&CARDS[i].c===CARDS[ci].c);
    const others=CARDS.map((c,i)=>i).filter(i=>i!==ci&&!sameCat.includes(i));
    const distract=shuffle(sameCat.concat(shuffle(others))).slice(0,3);
    return {ci, opts:shuffle([ci,...distract])};
  });
  quiz={sid, cat, qs, qi:0, score:0, answered:0};
  return true;
}
function showQuizPlay(){
  $("quizSetup").hidden=true; $("quizDone").hidden=true; $("quizPlay").hidden=false;
  window.scrollTo({top:0});
  renderQuestion();
}
function renderQuestion(){
  const q=quiz.qs[quiz.qi], c=CARDS[q.ci];
  $("qBar").style.width=(quiz.qi/quiz.qs.length*100)+"%";
  $("qCount").textContent=`Question ${quiz.qi+1} / ${quiz.qs.length}`;
  $("qScoreLive").textContent=`Score: ${quiz.score}`;
  $("qDef").textContent=c.d;
  $("qNext").hidden=true;
  $("qNext").textContent=quiz.qi===quiz.qs.length-1?"See results →":"Next →";
  const box=$("qOpts"); box.innerHTML="";
  q.opts.forEach(oi=>{
    const b=document.createElement("button"); b.className="opt";
    b.textContent=CARDS[oi].t+(CARDS[oi].a==="—"?"":"  ("+CARDS[oi].a+")");
    b.onclick=()=>answer(b,oi===q.ci,q);
    box.appendChild(b);
  });
}
function answer(btn,correct,q){
  [...$("qOpts").children].forEach(b=>b.disabled=true);
  quiz.answered++;
  if(correct){ btn.classList.add("correct"); quiz.score++; }
  else{ btn.classList.add("wrong");
    [...$("qOpts").children].forEach(b=>{
      if(b.textContent.startsWith(CARDS[q.ci].t)) b.classList.add("correct");
    });
  }
  $("qScoreLive").textContent=`Score: ${quiz.score}`;
  $("qNext").hidden=false;
}
$("quizStart").onclick=startQuiz;
$("qNext").onclick=()=>{ quiz.qi++; if(quiz.qi>=quiz.qs.length) finishQuiz(false); else renderQuestion(); };
$("qEnd").onclick=()=>{ if(!quiz) return;
  if(quiz.answered===0){ const sid=quiz.sid; quiz=null; renderQuizSetup(); return; }
  finishQuiz(true);
};
function finishQuiz(early){
  const s=store.students.find(x=>x.id===quiz.sid);
  const total=early?quiz.answered:quiz.qs.length;
  const pct=Math.round(quiz.score/total*100);
  if(s){ const item={name:s.name, d:Date.now(), score:quiz.score, total, cat:quiz.cat, partial:!!early}; s.quizzes.push(item); save(); syncResult(item); }
  $("qBar").style.width="100%";
  $("qScore").textContent=pct+"%";
  $("qDetail").innerHTML=`${escapeHtml(s?s.name:"")}: ${quiz.score} out of ${total} correct${early?" · unfinished":""}<br>${quiz.cat==="All"?"All categories":escapeHtml(quiz.cat)} · ${new Date().toLocaleDateString()}`;
  $("quizPlay").hidden=true; $("quizDone").hidden=false;
  window.scrollTo({top:0});
  quiz=null;
}
$("qAgain").onclick=renderQuizSetup;

/* ---------- admin ---------- */
$("adminLink").onclick=()=>{
  if(store.admin){ showView("view-admin"); }
  else{ $("passMsg").style.display="none"; $("passInput").value=""; showView("view-adminlogin"); setTimeout(()=>$("passInput").focus(),300); }
};
function tryUnlock(){
  if($("passInput").value===ADMIN_PASS){
    store.admin=true; save(); showView("view-admin");
  }else{ $("passMsg").style.display="block"; $("passInput").value=""; $("passInput").focus(); }
}
$("unlockBtn").onclick=tryUnlock;
$("passInput").addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock(); });
$("lockBtn").onclick=()=>{ store.admin=false; save(); showView("view-study"); };
function renderAdmin(){
  const list=$("adminList"); list.innerHTML="";
  if(!store.students.length){
    list.innerHTML='<div class="sempty">No students yet.</div>'; return;
  }
  const sorted=[...store.students].sort((a,b)=>a.name.localeCompare(b.name));
  sorted.forEach(s=>{
    const knownCount=new Set(s.known).size;
    const q=s.quizzes||[];
    const row=document.createElement("div"); row.className="srow";
    let qHtml=q.length
      ? q.slice().reverse().map(x=>{
          const d=new Date(x.d);
          return `${d.toLocaleDateString()} · ${escapeHtml(x.cat==="All"?"All":x.cat)} · <b>${x.score}/${x.total}</b> (${Math.round(x.score/x.total*100)}%)${x.partial?" · unfinished":""}`;
        }).join("<br>")
      : "No quizzes taken yet.";
    row.innerHTML=`<div class="sname">${escapeHtml(s.name)}
        <div class="sstats">Participation: ★ ${knownCount}/${CARDS.length} cards known · ${q.length} quiz${q.length===1?"":"zes"} taken</div>
        <div class="squiz">${qHtml}</div>
      </div>`;
    list.appendChild(row);
  });
  loadRemote();
}
async function loadRemote(){
  const box=$("adminRemote"); if(!box) return;
  if(!fbURL()){ box.innerHTML='<span class="sempty">Sync not set up yet.</span>'; return; }
  try{
    const r=await fetch(fbURL()); const data=await r.json();
    const arr=Object.values(data||{});
    if(!arr.length){ box.innerHTML='<span class="sempty">No synced results yet.</span>'; return; }
    const byName={};
    arr.forEach(x=>{ if(!x||!x.name) return; const k=String(x.name).trim(); (byName[k]=byName[k]||[]).push(x); });
    box.innerHTML=Object.keys(byName).sort((a,b)=>a.localeCompare(b)).map(n=>{
      const qs=byName[n].slice().sort((a,b)=>b.d-a.d);
      const rows=qs.map(x=>{
        const d=new Date(x.d||Date.now());
        const pct=x.total?Math.round(x.score/x.total*100):0;
        return `${d.toLocaleDateString()} · ${escapeHtml(x.cat==="All"?"All":(x.cat||"All"))} · <b>${x.score}/${x.total}</b> (${pct}%)${x.partial?" · unfinished":""}`;
      }).join("<br>");
      return `<div class="srow"><div class="sname">${escapeHtml(n)}<div class="sstats">${qs.length} quiz${qs.length===1?"":"zes"} taken (all devices)</div><div class="squiz">${rows}</div></div></div>`;
    }).join("");
  }catch(e){ box.innerHTML='<span class="sempty">Could not load synced results. Check connection.</span>'; }
}

renderChips(); resetDeck(); showView("view-study"); flushQueue();
</script>
